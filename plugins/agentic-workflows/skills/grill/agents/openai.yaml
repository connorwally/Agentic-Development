interface:
  display_name: "Grill"
  short_description: "Grill issues against project docs and ADRs"
  default_prompt: "Use $grill to review this GitHub issue against the repository docs and ADRs, then question me about the remaining ambiguities."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub access for reading issues, comments, linked work, and repository context"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"

policy:
  allow_implicit_invocation: false
